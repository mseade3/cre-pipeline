[project]
name = "cre-pipeline"
version = "0.1.0"
description = "Compliance-minded commercial property research pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.49,<2",
  "tenacity>=9.1,<10",
  "typer>=0.16,<1",
]

[project.scripts]
cre-pipeline = "cre_pipeline.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pandas-stubs>=2.3,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1,<4",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cre_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cre_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
